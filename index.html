<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>

    <body>
        <main class="game">

            <div class="header">
                <h1 class="title">Rock Paper Scissors</h1>
                <h2 class="subtitle">First to 5 points wins!</h2>
            </div>

            <div class="score-container">
                <div class="human-score-container">
                    <p class="human-header">You</p>
                    <p class="human-score">0</p>
                </div>

                <p class="versus">vs</p>

                <div class="comp-score-container">
                    <p class="comp-header">Computer</p>
                    <p class="comp-score">0</p>
                </div>
            </div>

            <div class="selection-container">
                <p class="choose">Choose your move</p>
                <div class="btns">
                    <button class="btn" id="rock">Rock</button>
                    <button class="btn" id="paper">Paper</button>
                    <button class="btn" id="scissors">Scissors</button>
                </div>
            </div>

            <div class="logs-container">
                <p class="log-header">Game Log</p>
                <div class="logs">
                    <p class="log">Waiting for move...</p>
                </div>
            </div>

            <div class="result-container">
                <div class="result">
                    <p class="msg">You win the game!</p>
                    <p class="final-score">Final Score: You 5 - 1 Computer</p>
                </div>
            </div>

        </main>
    </body>
    <script src="./script.js"></script>
</html>
